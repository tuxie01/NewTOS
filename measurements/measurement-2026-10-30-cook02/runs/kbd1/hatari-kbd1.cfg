# hatari.cfg -- the oracle's pinned Hatari 2.6.1 settings (--configfile).
#
# Only settings that can change what EmuTOS or a dumper sees. Everything not
# named here is Hatari's built-in default (tools/hatari-oracle.sh runs with an
# empty HOME, so no user configuration is read). No paths: ROM, drive C: and
# Hatari itself come from tools/oracle/oracle.env via the command line.
#
# Values = the user configuration every Hatari reference up to 2026-10-26 ran
# with; where they equal Hatari's default they are still stated, so a Hatari
# with other defaults cannot shift them. docs/analysis/ORACLE.md section 2.
#
# Never pass this file together with --saveconfig: Hatari writes the whole
# configuration back into the --configfile path.

[System]
nModelType = 4
nCpuLevel = 3
nCpuFreq = 32
bCompatibleCpu = TRUE
bCycleExactCpu = TRUE
bCpuDataCache = TRUE
bAddressSpace24 = FALSE
n_FPUType = 68882
bSoftFloatFPU = FALSE
bMMU = FALSE
bBlitter = FALSE
nDSPType = 0
VideoTiming = 3
nRtcYear = 0
bPatchTimerD = FALSE
bFastBoot = FALSE

[Memory]
nMemorySize = 4096
nTTRamSize = 16384

[ROM]
bPatchTos = TRUE

[Screen]
nMonitorType = 1
bUseExtVdiResolutions = FALSE

[Keyboard]
nCountryCode = -1
nKbdLayout = 1
nLanguage = -1

[HardDisk]
nGemdosCase = 0
nWriteProtection = 0
bFilenameConversion = FALSE
bGemdosHostTime = FALSE

[Log]
bNatFeats = FALSE

[Debugger]
nExceptionDebugMask = 536870918
