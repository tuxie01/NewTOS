[package]
name = "tos-api"
version = "0.6.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "NewTOS TOS-API surface (GEMDOS / BIOS / XBIOS dispatchers and syscalls)"
# No forced-target: the kernel pins itself to aarch64-unknown-none-softfloat
# and its dependencies follow, so this crate still builds freestanding there.
# Leaving it unpinned is what lets `cargo test -p tos-api` build for the host,
# which is where the reference-dump conformance tests run.

[lib]
name = "tos_api"
path = "src/lib.rs"

[features]
default = []
# AES trap-path tracer (`src/aes/trace.rs`) — a debugging instrument, off by
# default. With this off the tracer's hooks have empty bodies and its ring
# buffer static does not exist, so it costs neither code nor BSS. See the
# module docs for the capture/flush design.
aes-trace = []
# GEMDOS trap-path tracer (`src/gemdos/trace.rs`) — the file-system half of the
# dispatcher log `docs/TOS-REFERENCE-DUMPER.md` §10 asks for. Off by default:
# with this off the tracer's hooks have empty bodies and its ring buffer static
# does not exist, so it costs neither code nor BSS. See the module docs for the
# capture table, the caller-memory rules and the re-entrancy design.
gemdos-trace = []
# Crash diagnosis readers (TASK/PROC08): `bdos::process::mmu::diag` (a
# checked software walk of a user VA through a slot's tables) and
# `bdos::process::memprot::diag` (the rights model's view of one page), and
# `bdos::process::crash_diag` (the collected diagnosis and its serial and
# screen renderings), used by the kernel feature `crash-walk`. Off by
# default: with this off these modules do not exist. The host tests switch it on through the
# dev-dependency below (`tests/proc08_crash_walk.rs`).
crash-walk = []

[dependencies]
tos-types = { path = "../tos-types" }

[dev-dependencies]
# The crate itself with `crash-walk` on, so the host tests reach the crash
# diagnosis readers (TASK/PROC08). Dev-dependency features are unified only
# into test builds (resolver 2): the kernel's build of this crate does not
# get the feature.
tos-api = { path = ".", features = ["crash-walk"] }
